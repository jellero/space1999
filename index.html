<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Prototipo responsive e multilingue della home page Space1999." data-page-description>
    <title>Space1999</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cover.space1999.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap">
    <link rel="stylesheet" href="./assets/styles.css?v=20260826-11">
  </head>

  <body>
    <a class="skip-link" href="#main-content" data-i18n="skipLink">Vai al contenuto principale</a>

    <header class="site-header">
      <div class="container header-top">
        <a class="brand" href="./" aria-label="Space1999 home">
          <img
            src="https://space1999.com/bundles/mercuriospace/shop/images/03_Marchio_Space.jpg"
            alt="Space1999"
            width="150"
            height="90"
          >
        </a>

        <p class="claim" data-i18n="header.claim">International distributor of media products</p>

        <div class="header-tools">
          <a class="shipping" href="https://space1999.com/it/shop/shipping" data-localized-route="/shop/shipping">
            <strong>INFO</strong> <span data-i18n="header.shipping">Spedizioni</span>
          </a>

          <nav class="language" aria-label="Lingua" data-i18n-aria-label="header.languageLabel">
            <a href="?lang=it" lang="it" data-language="it">IT</a>
            <span aria-hidden="true">|</span>
            <a href="?lang=en" lang="en" data-language="en">EN</a>
          </nav>

          <form class="login" aria-label="Accesso clienti" data-i18n-aria-label="header.loginLabel">
            <input type="email" autocomplete="email" placeholder="e-Mail" aria-label="e-Mail">
            <input type="password" autocomplete="current-password" placeholder="Password" aria-label="Password">
            <div>
              <button type="button" data-i18n="header.login">Log in</button>
              <button type="button" data-i18n="header.register">Registrati</button>
            </div>
          </form>
        </div>

        <div class="mobile-actions">
          <button
            class="icon-button"
            type="button"
            data-search-open
            aria-label="Apri ricerca"
            data-i18n-aria-label="header.openSearch"
            aria-controls="mobile-navigation"
            aria-expanded="false"
          >
            <span aria-hidden="true">⌕</span>
          </button>
          <button
            class="icon-button"
            type="button"
            data-menu-open
            aria-label="Apri menu"
            data-i18n-aria-label="header.openMenu"
            aria-controls="mobile-navigation"
            aria-expanded="false"
          >
            <span class="burger" aria-hidden="true"></span>
          </button>
        </div>
      </div>

      <div class="nav-shell">
        <nav class="container" aria-label="Menu principale" data-i18n-aria-label="header.mainMenuLabel">
          <ul class="desktop-menu" data-desktop-menu aria-busy="true"></ul>
        </nav>
      </div>

      <form
        class="container search"
        role="search"
        action="https://space1999.com/it/shop/search"
        method="get"
        data-search-form
      >
        <div class="search-field">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <circle cx="10" cy="10" r="6.5"></circle>
            <path d="m15 15 6 6"></path>
          </svg>
          <input
            type="search"
            name="s"
            autocomplete="off"
            placeholder="cerca per testo o barcode"
            data-i18n-placeholder="header.searchPlaceholder"
            aria-label="Cerca per testo o barcode"
            data-i18n-aria-label="header.searchLabel"
          >
        </div>

        <div class="search-actions">
          <label>
            <input type="checkbox" name="onlystock">
            <span data-i18n="header.stockOnly">Solo disponibili</span>
          </label>
          <button type="submit" data-i18n="header.search">Cerca</button>
          <button type="button" data-advanced-search data-url="https://space1999.com/it/shop/searchadv" data-i18n="header.advancedSearch">
            Ricerca avanzata
          </button>
        </div>
      </form>
    </header>

    <button
      class="drawer-overlay"
      type="button"
      data-drawer-overlay
      aria-label="Chiudi menu"
      data-i18n-aria-label="header.closeMenu"
    ></button>

    <aside
      class="mobile-panel"
      id="mobile-navigation"
      data-mobile-panel
      aria-hidden="true"
      aria-label="Navigazione mobile"
      data-i18n-aria-label="header.mobileNavigationLabel"
    >
      <div class="mobile-panel__head">
        <strong data-i18n="header.menu">Menu</strong>
        <button type="button" data-menu-close aria-label="Chiudi menu" data-i18n-aria-label="header.closeMenu">×</button>
      </div>

      <form
        class="mobile-search"
        role="search"
        action="https://space1999.com/it/shop/search"
        method="get"
        data-mobile-search
        data-search-form
      >
        <input
          type="search"
          name="s"
          autocomplete="off"
          placeholder="Cerca"
          data-i18n-placeholder="header.search"
          aria-label="Cerca"
          data-i18n-aria-label="header.searchLabel"
        >
        <button type="submit" aria-label="Avvia ricerca" data-i18n-aria-label="header.startSearch">⌕</button>
      </form>

      <nav aria-label="Menu principale mobile" data-i18n-aria-label="header.mobileMenuLabel">
        <ul class="mobile-menu" data-mobile-menu aria-busy="true"></ul>
      </nav>

      <p class="navigation-status" data-navigation-status role="status" hidden></p>
    </aside>

    <!-- Main e footer sono shell semantiche: i contenuti arrivano da data/content.json. -->
    <main id="main-content" data-main-root aria-busy="true">
      <p class="page-status container" data-page-status role="status">Caricamento contenuti…</p>
    </main>

    <footer class="site-footer" data-footer-root aria-busy="true">
      <p class="page-status container" data-footer-status role="status">Caricamento footer…</p>
    </footer>

    <div class="product-modal" data-product-modal aria-hidden="true" hidden>
      <button
        class="product-modal__overlay"
        type="button"
        data-product-modal-close
        tabindex="-1"
        aria-label="Chiudi anteprima prodotto"
        data-i18n-aria-label="modal.closePreview"
      ></button>
      <div
        class="product-modal__dialog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="product-modal-title"
        aria-describedby="product-modal-meta"
      >
        <button
          class="product-modal__close"
          type="button"
          data-product-modal-close
          aria-label="Chiudi"
          data-i18n-aria-label="modal.close"
        >×</button>
        <div class="product-modal__content">
          <div class="product-modal__image" data-product-modal-image></div>
          <div class="product-modal__info">
            <p class="product-modal__artist" data-product-modal-artist></p>
            <h2 id="product-modal-title" data-product-modal-title></h2>
            <p class="product-modal__meta" id="product-modal-meta" data-product-modal-meta></p>
            <a class="product-modal__details" href="./" data-product-modal-link data-i18n="modal.details">Vedi scheda completa</a>
          </div>
        </div>
      </div>
    </div>

    <noscript>
      <p class="noscript-message">Per visualizzare il catalogo è necessario abilitare JavaScript.</p>
    </noscript>

    <script type="module" src="./assets/js/app.js?v=20260826-11"></script>
  </body>
</html>
