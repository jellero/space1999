<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Space1999</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/styles.css?v=20260826-3">
</head>
<body>
  <header class="site-header">
    <div class="container header-top">
      <a class="brand" href="/" aria-label="Space1999 home">
        <img src="https://space1999.com/bundles/mercuriospace/shop/images/03_Marchio_Space.jpg" alt="Space1999">
      </a>
      <p class="claim">International distributor of media products</p>
      <div class="header-tools">
        <a class="shipping" href="https://space1999.com/en/shop/shipping"><strong>INFO</strong> Shipment</a>
        <nav class="language" aria-label="Lingua"><a href="#it">IT</a><span>|</span><a class="active" href="#en">EN</a></nav>
        <form class="login">
          <input type="email" placeholder="e-Mail" aria-label="e-Mail">
          <input type="password" placeholder="Password" aria-label="Password">
          <div><button type="button">Log in</button><button type="button">Register</button></div>
        </form>
      </div>
      <div class="mobile-actions">
        <button class="icon-button" type="button" data-search-open aria-label="Cerca">⌕</button>
        <button class="icon-button" type="button" data-menu-open aria-label="Apri menu"><span class="burger"></span></button>
      </div>
    </div>
    <div class="nav-shell">
      <nav class="container" aria-label="Menu principale"><ul class="desktop-menu" data-desktop-menu></ul></nav>
    </div>
    <form class="container search" role="search">
      <span aria-hidden="true">⌕</span>
      <input type="search" name="q" placeholder="search by text or barcode" aria-label="Cerca per testo o barcode">
      <label><input type="checkbox"> Stock only</label>
      <button type="submit">Search</button><button type="button">Adv Search</button>
    </form>
  </header>
  <div class="overlay" data-overlay></div>
  <aside class="mobile-panel" data-mobile-panel aria-hidden="true">
    <div class="mobile-panel__head"><strong>Menu</strong><button type="button" data-menu-close aria-label="Chiudi menu">×</button></div>
    <form class="mobile-search" role="search"><input type="search" name="q" placeholder="Cerca"><button type="submit">⌕</button></form>
    <nav aria-label="Menu mobile"><ul class="mobile-menu" data-mobile-menu></ul></nav>
  </aside>
  <script src="./assets/app.js?v=20260826-3" defer></script>
</body>
</html>
